protocol_version: 7
protocol_name: c3_isolated_trace_sealed_reconstruction_development_v7
status: development_only_no_confirmatory_claim
seed: 20260815
output_root: outputs/bench_coe/innovation/cross_examined_certificates/dev_v7_20260815
models_dir: models
physical_gpus: [0, 1, 2, 3]

innovation_hypothesis:
  name: isolated_trace_sealed_reconstruction
  claim_scope: joint_mechanism_only_subject_to_scoped_prior_art_search
  components_individually_may_have_prior_art: true
  pointwise_evaluation_is_prior_art: true
  pointwise_then_pairwise_evaluation_is_prior_art: true
  prepair_is_direct_near_prior: true
  contrastive_valid_invalid_pairs_are_prior_art: true
  commit_reveal_and_post_commit_permutation_are_prior_art: true
  exact_joint_mechanism_found_in_scoped_search: false
  global_novelty_claim_authorized: false

data_policy:
  labels_are_development_only: true
  generation_reads_labels: false
  consumed_locked_tests_excluded: [musr_test]
  previously_observed_sets_may_only_be_used_for_development: true
  statistical_unit: unique_question
  generator_reads_only_own_private_stage0_response: true
  generator_reads_other_model_outputs: false
  generator_reads_votes_or_popularity: false
  externally_assigned_generator_target_is_absent: true
  author_commits_before_trace_permutation: true
  trace_permutation_is_deterministic_and_label_free: true
  generator_effect_claim_is_sealed: true
  checker_private_stage0_response_is_hidden: true
  checker_generator_identity_is_hidden: true
  checker_effect_claim_is_hidden: true
  checker_valid_trace_claim_is_hidden: true
  checker_sibling_trace_is_hidden: true
  checker_pair_existence_is_hidden: true
  checker_first_difference_is_hidden: true
  checker_commitment_source: stage0_base_prediction
  checker_views: [trace_1, trace_2]
  pair_is_combined_only_after_both_outputs_are_frozen: true
  target_labels_control_stopping_or_selection: false

experts:
  - Baichuan2-7B-Chat
  - General-Reasoner-7B-preview
  - Llama-3.1-8B-Instruct
  - MAmmoTH2-8B-Plus
  - Ministral-8B-Instruct-2410
