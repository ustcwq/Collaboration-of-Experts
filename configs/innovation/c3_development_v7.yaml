    observable_cache_path: outputs/bench_coe/innovation/sanitized_targets/prior_art_v2/gpqa_common14
    reference_model: Qwen2.5-7B-Instruct
    config: diamond
    epoch: 0

# Reuse the v6 author protocol unchanged; only the checker scientific object changes.
certificate_generation:
  backend: vllm
  prompt_version: committed_counterfactual_permutation_v6
  parser_version: committed_counterfactual_challenge_fields_v6
  seed: 20260815
  temperature: 0.0
  top_p: 1.0
  max_model_len: 4096
  max_new_tokens: 512
  guided_regex: true
  guided_seal_is_complete_claim_or_complete_abstention: true
  batch_size: 32
  gpu_memory_utilization: 0.82
  dtype: auto
  trust_remote_code: true
  bounded_smoke_balances_presented_trace_slots: true

check_generation:
  backend: vllm
  prompt_version: blind_isolated_trace_audit_v7
  parser_version: isolated_trace_audit_fields_v7
  seed: 20260815
  temperature: 0.0
  top_p: 1.0
  max_model_len: 4096
  max_new_tokens: 256
  guided_regex: true
  batch_size: 32
  gpu_memory_utilization: 0.82
  dtype: auto
  trust_remote_code: true

# Frozen before the first v7 model call and enforced per generator/checker.
smoke_acceptance:
  minimum_witness_parse_rate: 0.90
  minimum_nonabstaining_witness_rate: 0.50
  minimum_reconstruction_parse_rate: 0.90
  minimum_complete_isolated_trace_pair_rate: 0.80
  minimum_one_valid_one_invalid_pair_rate: 0.20
  minimum_isolated_sealed_triple_match_rate: 0.10
  maximum_prompt_truncations: 0
  maximum_all_option_effect_rate: 0.0
  require_candidate_neutral_generator: true
  require_private_stage0_trace: true
  require_sealed_claim: true
  require_post_commit_permutation: true
  require_stage0_commitments: true
  require_both_isolated_trace_views: true
  require_sibling_trace_hidden: true
  require_pair_existence_hidden: true
  require_both_presented_trace_slots_in_bounded_smoke: true

outer_validation:
  scheme: leave_one_environment_out
  environment: dataset_plus_subject
  nested_selection: true
  selection_metric: macro_environment_accuracy_then_micro_accuracy
  bootstrap_samples: 10000
  bootstrap_seed: 20260815

variant_grid:
  regularization_c: [0.01, 0.1, 1.0, 10.0]
  intervention_margin: [0.0, 0.05, 0.10, 0.15]
  open_option_set: true
  use_certificates: true
  use_checks: true
  use_generator_answer_dependence: true
  use_checker_answer_dependence: true
  use_generator_checker_pair_effects: true
  use_sealed_set_agreement: true
  use_counterfactual_parity: true

near_prior_baseline_grid:
  static_base_prior_strength: [0.0, 0.5, 1.0, 2.0]
  static_intervention_margin: [0.0, 0.05, 0.10, 0.15]
  minority_veto_threshold: [1, 2, 3]

acceptance:
  minimum_oof_delta_vs_deployable_best_single_pp: 5.0
  minimum_oof_delta_vs_full_development_best_single_pp: 0.0
  minimum_per_dataset_delta_pp: 0.0
  require_paired_bootstrap_ci_low_gt_zero: true
  require_two_sided_mcnemar_p_lt: 0.05
  require_full_ablation_and_cost_report: true
  require_equal_call_single_model_baselines: true
  require_pre_pair_style_pointwise_pairwise_baseline: true
  blind_test_authorized_only_after_all_development_gates_pass: true
