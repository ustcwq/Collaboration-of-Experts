protocol_version: 1
experiment_id: locked_musr_paper_v1_20260815
status: preregistered_before_target_prediction
scope: confirmatory_secondary_test
target_use_policy:
  questions_and_model_outputs_visible: true
  target_answers_visible: evaluator_only_after_prediction_seal
  forbidden_target_uses:
    - fitting
    - hyperparameter_selection
    - method_selection
    - prompt_selection
    - parser_selection
    - expert_pool_selection
    - seed_selection
    - subset_selection
    - stopping_rule
  evaluate_all_expected_questions: true
  preserve_negative_results: true

